# One-click Render Blueprint for the NovaCore page + search/Gemini proxy.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
#
# The service decides its own origin from the request Host header, so the public URL does not
# have to be configured here. NOVACORE_PUBLIC_ORIGIN is only needed for callers on a *different*
# origin, e.g. the .apk (origin "null") or a page hosted elsewhere.
services:
  - type: web
    name: novacore-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NOVACORE_TRUST_PROXY
        value: "true"
      # The packaged Windows .exe / Android .apk load their page from file://, so they call the live
      # server with Origin "null". Without this entry the API answers them 403.
      - key: NOVACORE_PUBLIC_ORIGIN
        value: "null"
      # Optional: lets users get Gemini answers without saving their own key.
      - key: NOVACORE_GEMINI_API_KEY
        sync: false
